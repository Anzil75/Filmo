{% extends "base.html" %}
{% block title %}Film maker sign-up — FILMO{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">

        <h3 class="card-title mb-1">🎬 Film maker sign-up</h3>
        <p class="text-muted">
          Your request goes to the admin for approval — you can log in once it's accepted.
        </p>

        <form method="POST">

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full name</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email address</label>
              <input type="email" name="email" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone number</label>
              <input type="text" name="phone" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Production house / company</label>
              <input type="text" name="company" class="form-control"
                     placeholder="e.g. Sunrise Studios" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Experience (years)</label>
              <input type="number" name="experience" class="form-control" min="0" max="70" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" required>
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100 mt-4">Send approval request</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Are you a performer instead?
          <a href="{{ url_for('register_user') }}">Sign up here</a>
        </p>

      </div>
    </div>
  </div>
</div>

{% endblock %}
