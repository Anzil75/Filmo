{% extends "base.html" %}
{% block title %}My profile — FILMO{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-9">
    <div class="card shadow-sm">
      <div class="card-body p-4">

        <h3 class="card-title mb-1">👤 My profile</h3>
        <p class="text-muted">
          This is what film makers see about you. Keep it fresh.
        </p>

        <form method="POST">

          <div class="row g-3">

            <!-- Email and role can't be changed: email is how the system finds you -->
            <div class="col-md-6">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" value="{{ user.email }}" disabled>
              <div class="form-text">Your email can't be changed.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Account type</label>
              <input type="text" class="form-control" value="Performer" disabled>
            </div>

            <div class="col-md-6">
              <label class="form-label">Full name</label>
              <input type="text" name="name" class="form-control"
                     value="{{ user.name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone number</label>
              <input type="text" name="phone" class="form-control"
                     value="{{ user.phone }}" required>
            </div>

            <div class="col-md-3">
              <label class="form-label">Age</label>
              <input type="number" name="age" class="form-control"
                     value="{{ user.age }}" min="1" max="120" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Gender</label>
              <select name="gender" class="form-select" required>
                {% for g in genders %}
                  <option value="{{ g }}" {% if user.gender == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-5">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control"
                     value="{{ user.city }}" required>
            </div>

            <div class="col-12">
              <label class="form-label">Your skills</label>
              <input type="text" name="skills" class="form-control"
                     value="{{ user.skills }}"
                     placeholder="e.g. Acting, Classical dance, Singing" required>
            </div>

            <div class="col-12">
              <label class="form-label">About you</label>
              <textarea name="bio" class="form-control" rows="3">{{ user.bio }}</textarea>
            </div>

          </div>

          <button type="submit" class="btn btn-dark w-100 mt-4">Save changes</button>
        </form>

        <p class="text-muted small mt-3 mb-0">
          Member since {{ user.created_at | nice_date }}.
        </p>

      </div>
    </div>

    <div class="d-flex gap-2 mt-3">
      <a class="btn btn-secondary" href="{{ url_for('user_dashboard') }}">&larr; Back to dashboard</a>
      <a class="btn btn-outline-dark" href="{{ url_for('user_talents') }}">🎥 My talent videos</a>
    </div>

  </div>
</div>

{% endblock %}
